services:
  relay:
    image: remote-pointer-relay:local
    build:
      context: ../..
      dockerfile: src/RemotePointer.Server/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Deployment__BehindHttpsProxy: "true"
      Sessions__ReceiverDiscoveryEnabled: ${REMOTEPOINTER_RECEIVER_DISCOVERY_ENABLED:-true}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "443:443"
    environment:
      REMOTEPOINTER_HOSTNAME: ${REMOTEPOINTER_HOSTNAME:?Set REMOTEPOINTER_HOSTNAME in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
