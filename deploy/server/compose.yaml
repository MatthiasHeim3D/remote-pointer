services:
  relay:
    image: remote-annotate-relay:local
    build:
      context: ../..
      dockerfile: src/RemoteAnnotate.Server/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Deployment__BehindHttpsProxy: "true"
      Access__ServerPassword: ${REMOTEANNOTATE_SERVER_PASSWORD:?Set REMOTEANNOTATE_SERVER_PASSWORD in .env}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "443:443"
    environment:
      REMOTEANNOTATE_HOSTNAME: ${REMOTEANNOTATE_HOSTNAME:?Set REMOTEANNOTATE_HOSTNAME in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
